[package]
name = "gemacast-pc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[build-dependencies]
embed-manifest = "1"
tauri-winres = "0.3.6"

[dependencies]
gemacast-core = { path = "../gemacast-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "signal"] }
tao = "0.34.6"
tray-icon = "0.21.3"
rfd = "0.17.2"
whoami = "2.1.1"
thread-priority = "3.0.0"
async-trait = "0.1"
# `release_max_level_off` compiles every `tracing::*` call in this crate and its
# dependencies out of release/dist builds — no log output in a shipped artifact.
# Dev builds (`cargo run`, `cargo test`) are unaffected: the feature only applies
# under `not(debug_assertions)`. Crash reporting does not go through `tracing`.
tracing = { version = "0.1", features = ["release_max_level_off"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
image = "0.25.10"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
open = "5"
dirs = "6"
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
ring = "0.17"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
# Console feature only: lets the GUI subsystem binary (`windows_subsystem =
# "windows"`) attach to the parent terminal's console when launched from one, so
# tracing output is visible. Without this, stderr goes nowhere for a GUI binary.
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

# ── Linux .deb packaging (cargo-deb) ─────────────────────────────────────────
[package.metadata.deb]
maintainer = "Echa Apriliyanto <echa.apriliyanto.dev@gmail.com>"
section = "sound"
depends = "$auto"
assets = [
    ["target/release/gemacast-pc", "usr/bin/", "755"],
    ["linux/gemacast-pc.desktop", "usr/share/applications/", "644"],
    ["linux/gemacast-pc.png", "usr/share/icons/hicolor/256x256/apps/gemacast-pc.png", "644"],
]

# ── Linux .rpm packaging (cargo-generate-rpm) ────────────────────────────────
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gemacast-pc", dest = "/usr/bin/gemacast-pc", mode = "0755" },
    { source = "linux/gemacast-pc.desktop", dest = "/usr/share/applications/gemacast-pc.desktop", mode = "0644" },
    { source = "linux/gemacast-pc.png", dest = "/usr/share/icons/hicolor/256x256/apps/gemacast-pc.png", mode = "0644" },
]
