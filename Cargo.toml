[workspace]
resolver = "2"
members = ["gemacast-core", "gemacast-pc", "gemacast-mobile/src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["Echa Apriliyanto <echa.apriliyanto.dev@gmail.com>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/Kazzaky/gemacast"
description = "Low-latency real-time audio streaming from PC to Android over Wi-Fi and USB tethering."
repository = "https://github.com/Kazzaky/gemacast"
keywords = ["audio", "streaming"]
categories = ["multimedia"]


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
audiopus_sys = { path = "vendor/audiopus_sys" }
# Backport of gtk-rs-core PR #2009 / Debian rust-glib-0.18 0.18.5-7 patch 0007.
# The commit is pinned because upstream declined a 0.18.6 release; it only fixes
# VariantStrIter's unsound FFI out-pointer from &p to &mut p.
glib = { git = "https://github.com/jcfs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a", package = "glib" }
